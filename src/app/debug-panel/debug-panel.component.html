@if (debugPanelService.isVisible()) {
<gg-panel class="debug-panel">
    <h3>DEBUG PANEL</h3>
    <div>seed : {{ debugPanelService.seed() }}</div>
    <div>3D items : assets : {{ debugPanelService.meshCount() }} - polys : {{ debugPanelService.polygonCount() }}</div>
    <div>position : {{ debugPanelService.worldPosition() }}</div>
    <button gg-button type="button" (click)="debugPanelService.hideShadows()">Hide shadows</button>
    <button gg-button type="button" (click)="debugPanelService.toggleDuck()">
        {{ debugPanelService.isDuckVisible() ? 'Hide duck' : 'Show duck' }}
    </button>
    <button gg-button type="button" (click)="debugPanelService.toggleTrees()">
        {{ debugPanelService.areTreesVisible() ? 'Hide trees' : 'Show trees' }}
    </button>
    <button gg-button type="button" (click)="debugPanelService.toggleSkyView()">
        {{ debugPanelService.isSkyView() ? 'Player view' : 'Sky view' }}
    </button>
</gg-panel>
}

@if (debugPanelService.showFps()) {
<gg-fps-counter [fps]="debugPanelService.fps()" />
}
